name: Android APK build for 0.6.145
on:
  push:
    branches: [build/mobile-0.6.145]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51b5fd85d2db7eaae622a15430c0437a2a9c3623
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --global pnpm@10.28.2
      - run: pnpm --filter @multica/mobile... install --frozen-lockfile
      - name: Build Android release
        working-directory: apps/mobile
        env:
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://api.multica.ai
          EXPO_PUBLIC_WEB_URL: https://multica.ai
          EXPO_NO_TELEMETRY: '1'
        run: |
          test "$(git rev-parse HEAD)" = '51b5fd85d2db7eaae622a15430c0437a2a9c3623'
          export ANDROID_HOME="$RUNNER_TEMP/multica-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          install_sdk() {
            local file="$1" sha="$2" dest="$3" tmp
            tmp="$(mktemp -d "$RUNNER_TEMP/sdk.XXXX")"
            curl --fail --silent --show-error --location --retry 3 "https://dl.google.com/android/repository/$file" -o "$tmp/$file"
            echo "$sha  $tmp/$file" | sha1sum -c -
            unzip -q "$tmp/$file" -d "$tmp/sdk"
            mkdir -p "$(dirname "$ANDROID_HOME/$dest")"
            local roots=("$tmp/sdk"/*)
            if [[ ${#roots[@]} == 1 && -d ${roots[0]} ]]; then
              mv "${roots[0]}" "$ANDROID_HOME/$dest"
            else
              mv "$tmp/sdk" "$ANDROID_HOME/$dest"
            fi
          }
          install_sdk platform-36_r02.zip 2c1a80dd4d9f7d0e6dd336ec603d9b5c55a6f576 platforms/android-36 &
          p1=$!
          install_sdk build-tools_r36_linux.zip b0b6376977657e8ad9b969bacf4093601da2c6fb build-tools/36.0.0 &
          p2=$!
          install_sdk build-tools_r35_linux.zip 2cfaa0bbb2336e9ec18ed3ecea84fa2e2af607bc build-tools/35.0.0 &
          p3=$!
          install_sdk android-ndk-r28c-linux.zip a7b54a5de87fecd125a17d54f73c446199e72a64 ndk/28.2.13676358 &
          p4=$!
          install_sdk cmake-3.22.1-linux.zip fd0a48b4a758310df8c7aa51f59840ed48fe7ed8 cmake/3.22.1 &
          p5=$!
          install_sdk platform-tools_r37.0.3-linux.zip e1579b288a7ae4e9bc28dedec6a154d78b3c04ed platform-tools &
          p6=$!
          for pid in "$p1" "$p2" "$p3" "$p4" "$p5" "$p6"; do wait "$pid"; done
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          pnpm exec expo prebuild --platform android --no-install
          (cd android; ./gradlew assembleRelease --console=plain --max-workers 2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process)
          node scripts/verify-apk.mjs
          mkdir -p "$RUNNER_TEMP/multica-145-apks"
          cp android/app/build/outputs/apk/release/app-*-release.apk "$RUNNER_TEMP/multica-145-apks/"
          cd "$RUNNER_TEMP/multica-145-apks"
          test "$(find . -name '*.apk' | wc -l)" -eq 4
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-0.6.145-apks
          path: ${{ runner.temp }}/multica-145-apks/
          if-no-files-found: error
          retention-days: 3
